apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: beacon
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/uramsaroop/beacon
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: beacon
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: beacon
