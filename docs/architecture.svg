<svg style="background:#f8fafc;font-family:sans-serif" viewBox="0 0 1100 770" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Homelab architecture for k3s node beaconapp">
  <defs><style>.title{font-size:20px;font-weight:650;fill:#172033}.label{font-size:14px;font-weight:600;fill:#172033}.small{font-size:12px;fill:#5b6475}.node{stroke:#64748b;stroke-width:1}.neutral{fill:#e2e8f0}.input{fill:#bfdbfe}.process{fill:#c7d2fe}.storage{fill:#99f6e4}.external{fill:#fde68a}.risk{fill:#fecaca}.edge{stroke:#64748b;stroke-width:1.5;fill:none}.zone{fill:none;stroke:#64748b;stroke-dasharray:6 5}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <text class="title" x="20" y="32">Homelab architecture · beaconapp</text>
  <text class="small" x="20" y="52">Live state 2026-11-20 · GitOps via Flux from homelab-gitops</text>

  <!-- zones -->
  <rect class="zone" x="260" y="64" width="820" height="690" rx="14" />
  <text class="small" x="276" y="84">Host beaconapp · Rocky Linux 9.8 · 192.168.1.217 · 4 vCPU · 7.5 GiB RAM</text>
  <rect class="zone" x="280" y="96" width="780" height="508" rx="12" />
  <text class="small" x="296" y="114">k3s v1.36.2 · single node · SQLite datastore</text>

  <!-- namespace groups -->
  <rect class="neutral" x="296" y="130" width="208" height="210" rx="10" opacity="0.45" />
  <text class="small" x="310" y="150">kube-system</text>
  <rect class="neutral" x="296" y="356" width="208" height="232" rx="10" opacity="0.45" />
  <text class="small" x="310" y="376">flux-system</text>
  <rect class="neutral" x="540" y="130" width="220" height="104" rx="10" opacity="0.45" />
  <text class="small" x="554" y="150">beacon</text>
  <rect class="neutral" x="540" y="246" width="220" height="104" rx="10" opacity="0.45" />
  <text class="small" x="554" y="266">gremlin</text>
  <rect class="neutral" x="800" y="130" width="244" height="458" rx="10" opacity="0.45" />
  <text class="small" x="814" y="150">monitoring</text>

  <!-- edges (behind nodes) -->
  <path class="edge" d="M220 146 C258 146 262 196 300 196" marker-end="url(#arrow)" />
  <text class="small" x="226" y="134">HTTP :80</text>
  <path class="edge" d="M500 190 L558 190" marker-end="url(#arrow)" />
  <path class="edge" d="M400 162 L400 124 L922 124 L922 160" marker-end="url(#arrow)" />
  <text class="small" x="610" y="120">grafana.home</text>
  <path class="edge" d="M220 344 C258 344 262 424 300 424" marker-end="url(#arrow)" />
  <text class="small" x="222" y="402">pull</text>
  <path class="edge" d="M400 452 L400 478" marker-end="url(#arrow)" />
  <path class="edge" d="M500 524 L650 524 L650 352" marker-end="url(#arrow)" />
  <path class="edge" d="M650 524 L798 524" marker-end="url(#arrow)" />
  <text class="small" x="660" y="516">reconcile</text>
  <path class="edge" d="M220 486 L268 486 L268 596 L580 596 L580 352" marker-end="url(#arrow)" />
  <text class="small" x="440" y="590">image pull</text>
  <path class="edge" d="M820 276 L742 196" marker-end="url(#arrow)" />
  <path class="edge" d="M820 292 L742 306" marker-end="url(#arrow)" />
  <text class="small" x="768" y="252" text-anchor="middle">scrape</text>
  <path class="edge" d="M922 222 L922 254" marker-end="url(#arrow)" />
  <path class="edge" d="M922 318 L922 346" marker-end="url(#arrow)" />
  <path class="edge" d="M922 410 L922 498" stroke-dasharray="4 4" />
  <path class="edge" d="M420 628 L420 606" marker-end="url(#arrow)" />
  <path class="edge" d="M670 628 L670 606" marker-end="url(#arrow)" />
  <text class="small" x="430" y="622">kubectl</text>
  <text class="small" x="680" y="622">read-only scan</text>

  <!-- external -->
  <rect class="node input" x="20" y="112" width="200" height="68" rx="10" />
  <text class="label" x="120" y="140" text-anchor="middle">LAN browsers</text>
  <text class="small" x="120" y="160" text-anchor="middle">beacon.home · grafana.home</text>

  <rect class="node external" x="20" y="300" width="200" height="88" rx="10" />
  <text class="label" x="120" y="328" text-anchor="middle">GitHub</text>
  <text class="small" x="120" y="348" text-anchor="middle">homelab-gitops (SSH)</text>
  <text class="small" x="120" y="366" text-anchor="middle">beacon · gremlin (HTTPS)</text>

  <rect class="node external" x="20" y="452" width="200" height="68" rx="10" />
  <text class="label" x="120" y="480" text-anchor="middle">ghcr.io</text>
  <text class="small" x="120" y="500" text-anchor="middle">beacon · gremlin :latest</text>

  <!-- kube-system -->
  <rect class="node process" x="310" y="162" width="180" height="62" rx="10" />
  <text class="label" x="400" y="188" text-anchor="middle">Traefik</text>
  <text class="small" x="400" y="208" text-anchor="middle">LoadBalancer :80 / :443</text>
  <rect class="node neutral" x="310" y="246" width="180" height="80" rx="10" />
  <text class="label" x="400" y="272" text-anchor="middle">Cluster services</text>
  <text class="small" x="400" y="292" text-anchor="middle">CoreDNS · metrics-server</text>
  <text class="small" x="400" y="310" text-anchor="middle">local-path provisioner</text>

  <!-- flux -->
  <rect class="node process" x="310" y="392" width="180" height="58" rx="10" />
  <text class="label" x="400" y="417" text-anchor="middle">source-controller</text>
  <text class="small" x="400" y="436" text-anchor="middle">fetches Git + Helm repos</text>
  <rect class="node process" x="310" y="480" width="190" height="92" rx="10" />
  <text class="label" x="405" y="506" text-anchor="middle">Reconcilers</text>
  <text class="small" x="405" y="526" text-anchor="middle">kustomize-controller</text>
  <text class="small" x="405" y="543" text-anchor="middle">helm-controller</text>
  <text class="small" x="405" y="560" text-anchor="middle">notification-controller</text>

  <!-- apps -->
  <rect class="node process" x="560" y="162" width="180" height="62" rx="10" />
  <text class="label" x="650" y="188" text-anchor="middle">beacon</text>
  <text class="small" x="650" y="208" text-anchor="middle">:8000 · beacon.home</text>
  <rect class="node process" x="560" y="278" width="180" height="62" rx="10" />
  <text class="label" x="650" y="304" text-anchor="middle">gremlin</text>
  <text class="small" x="650" y="324" text-anchor="middle">:8000 · internal only</text>

  <!-- monitoring -->
  <rect class="node process" x="822" y="162" width="200" height="60" rx="10" />
  <text class="label" x="922" y="187" text-anchor="middle">Grafana</text>
  <text class="small" x="922" y="206" text-anchor="middle">dashboards</text>
  <rect class="node process" x="822" y="256" width="200" height="62" rx="10" />
  <text class="label" x="922" y="281" text-anchor="middle">Prometheus</text>
  <text class="small" x="922" y="301" text-anchor="middle">7d retention</text>
  <rect class="node process" x="822" y="348" width="200" height="62" rx="10" />
  <text class="label" x="922" y="373" text-anchor="middle">Alertmanager</text>
  <text class="small" x="922" y="393" text-anchor="middle">receiver: null (silent)</text>
  <rect class="node neutral" x="822" y="424" width="200" height="62" rx="10" />
  <text class="label" x="922" y="449" text-anchor="middle">Exporters + operator</text>
  <text class="small" x="922" y="469" text-anchor="middle">kube-state · node-exporter</text>
  <rect class="node storage" x="822" y="500" width="200" height="74" rx="10" />
  <text class="label" x="922" y="524" text-anchor="middle">local-path PVCs</text>
  <text class="small" x="922" y="543" text-anchor="middle">Prom 8 Gi · Grafana 2 Gi</text>
  <text class="small" x="922" y="560" text-anchor="middle">Alertmanager 1 Gi</text>

  <!-- host processes outside the cluster -->
  <text class="small" x="296" y="644">Host processes outside k3s</text>
  <rect class="node risk" x="300" y="652" width="250" height="84" rx="10" />
  <text class="label" x="425" y="678" text-anchor="middle">OpenClaw gateway · Chewy</text>
  <text class="small" x="425" y="698" text-anchor="middle">:18789 · ~1.5 GiB RSS</text>
  <text class="small" x="425" y="716" text-anchor="middle">largest RAM user on host</text>
  <rect class="node neutral" x="580" y="652" width="190" height="84" rx="10" />
  <text class="label" x="675" y="678" text-anchor="middle">k8sgpt CLI</text>
  <text class="small" x="675" y="698" text-anchor="middle">v0.4.41 · on demand</text>
  <text class="small" x="675" y="716" text-anchor="middle">no AI backend</text>
  <rect class="node neutral" x="800" y="652" width="244" height="84" rx="10" />
  <text class="label" x="922" y="678" text-anchor="middle">k3s-server + containerd</text>
  <text class="small" x="922" y="698" text-anchor="middle">~950 MiB + ~200 MiB RSS</text>
  <text class="small" x="922" y="716" text-anchor="middle">control plane in one process</text>
</svg>
